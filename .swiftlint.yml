# SwiftLint Configuration for MouseOn

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional

line_length:
  warning: 120
  error: 200

identifier_name:
  min_length:
    warning: 1
    error: 1

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100

excluded:
  - Pods
  - .build
  - DerivedData
