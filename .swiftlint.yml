# SwiftLint Configuration for MouseOn

disabled_rules:
  - file_length # Disabled - single file app architecture

opt_in_rules:
  - empty_count

line_length:
  warning: 120
  error: 200

identifier_name:
  min_length:
    warning: 1 # Allow 1-char names like 'x', 'y', 'w', 'h' for coordinates
    error: 1

excluded:
  - Pods
  - .build
  - DerivedData
