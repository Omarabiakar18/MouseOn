<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Dark Background Gradient -->
        <linearGradient id="bgGradientDark" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2C2C2E"/>
            <stop offset="1" stop-color="#1C1C1E"/>
        </linearGradient>
        
        <!-- Drop Shadow -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
            <feOffset dx="0" dy="10" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.4"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- App Icon Background -->
    <rect x="50" y="50" width="924" height="924" rx="200" fill="url(#bgGradientDark)"/>

    <!-- Content Group -->
    <g filter="url(#dropShadow)">
        <!-- Monitor (Back) -->
        <path d="M512 620 V 740" stroke="#E5E5EA" stroke-width="24" stroke-linecap="butt" opacity="0.6"/>
        <path d="M432 740 H 592" stroke="#E5E5EA" stroke-width="24" stroke-linecap="round" opacity="0.6"/>
        
        <rect x="262" y="280" width="500" height="340" rx="24" stroke="#0A84FF" stroke-width="20" fill="#0A84FF" fill-opacity="0.1"/>
        <rect x="282" y="300" width="460" height="300" rx="12" fill="#0A84FF" fill-opacity="0.05"/>

        <!-- Laptop (Front Left) -->
        <rect x="182" y="520" width="380" height="260" rx="20" stroke="#E5E5EA" stroke-width="20" fill="#E5E5EA" fill-opacity="0.1"/>
        <rect x="202" y="540" width="340" height="220" rx="10" fill="#E5E5EA" fill-opacity="0.05"/>

        <!-- Mouse Cursor (White with Blue Stroke) -->
        <g transform="translate(580, 580) scale(1.2)">
            <path d="M0 0 L 60 180 L 105 135 L 165 195 L 195 165 L 135 105 L 180 60 L 0 0Z" fill="white" stroke="#0A84FF" stroke-width="5" stroke-linejoin="round"/>
        </g>
    </g>
</svg>