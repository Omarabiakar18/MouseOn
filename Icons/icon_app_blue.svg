<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGradient" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
            <stop stop-color="#007AFF"/>
            <stop offset="1" stop-color="#0056B3"/>
        </linearGradient>
        
        <!-- Drop Shadow for elements -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
            <feOffset dx="0" dy="10" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- Screen Gradient -->
        <linearGradient id="screenGradient" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
        </linearGradient>
    </defs>

    <!-- App Icon Background (Squircle-ish) -->
    <rect x="50" y="50" width="924" height="924" rx="200" fill="url(#bgGradient)"/>

    <!-- Content Group with Shadow -->
    <g filter="url(#dropShadow)">
        <!-- Monitor (Back) -->
        <!-- Stand -->
        <path d="M512 620 V 740" stroke="white" stroke-width="24" stroke-linecap="butt" opacity="0.8"/>
        <path d="M432 740 H 592" stroke="white" stroke-width="24" stroke-linecap="round" opacity="0.8"/>
        
        <!-- Monitor Frame -->
        <rect x="262" y="280" width="500" height="340" rx="24" stroke="white" stroke-width="20" fill="white" fill-opacity="0.15"/>
        <!-- Monitor Screen Area -->
        <rect x="282" y="300" width="460" height="300" rx="12" fill="white" fill-opacity="0.1"/>

        <!-- Laptop/Secondary Display (Front Left) -->
        <rect x="182" y="520" width="380" height="260" rx="20" stroke="white" stroke-width="20" fill="white" fill-opacity="0.25"/>
        <!-- Screen Area -->
        <rect x="202" y="540" width="340" height="220" rx="10" fill="white" fill-opacity="0.1"/>

        <!-- Mouse Cursor (Prominent) -->
        <g transform="translate(580, 580) scale(1.2)">
            <path d="M0 0 L 60 180 L 105 135 L 165 195 L 195 165 L 135 105 L 180 60 L 0 0Z" fill="white" stroke="#004080" stroke-width="5" stroke-linejoin="round"/>
        </g>
    </g>
</svg>